stages:
  - build          
  - push_to_registry 
variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
image: docker:24.0
services:
  - docker:24.0-dind
build_app_job:
  stage: build 
  before_script:
    - echo "Logging in to GitLab Container Registry..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Building Docker image: $IMAGE_TAG"
    - docker build -t $IMAGE_TAG .
    - echo "Build complete."
  rules:
    - if: $CI_COMMIT_BRANCH
push_image_job:
  stage: push_to_registry 
  needs:
    - build_app_job 
  before_script:
    - echo "Logging in to GitLab Container Registry..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Pushing image $IMAGE_TAG to registry..."
    - docker push $IMAGE_TAG
    - echo "Push complete."
  rules:
    - if: $CI_COMMIT_BRANCH
