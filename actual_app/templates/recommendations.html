
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recommendations</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* General Body Styling */
        body {
            background: linear-gradient(135deg, #1f1f1f, #121212);
            color: #ffffff;
            font-family: 'Arial', sans-serif;
        }

        h3 {
            color: #ff6b6b;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
        }

        /* Movie Card */
        .card {
            background: #2b2b2b;
            color: #fff;
            border: none;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: scale(1.03);
            box-shadow: 0 12px 20px rgba(255, 107, 107, 0.3);
        }

        /* Poster Styling */
        .poster-container {
            width: 100%;
            height: 400px;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .poster-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
        }

        /* Card Body */
        .card-body {
            text-align: center;
            padding: 15px 10px;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #ff6b6b;
        }

        .card-text {
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 10px;
        }

        .btn-primary {
            background-color: #ff6b6b;
            border: none;
            transition: background 0.3s, transform 0.2s;
        }

        .btn-primary:hover {
            background-color: #fa5252;
            transform: scale(1.05);
            box-shadow: 0 4px 10px rgba(255, 107, 107, 0.5);
        }

        /* Back Button */
        .btn-secondary {
            background-color: #444;
            border: none;
        }

        .btn-secondary:hover {
            background-color: #555;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.9rem;
            color: #aaa;
        }

        .footer a {
            color: #ff6b6b;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h3><i class="fa-solid fa-film"></i> Film search results</h3>
        <div class="row">
            {% for movie in recommendations %}
            <div class="col-md-4 mb-4">
                <div class="card">
                    <!-- Movie Poster -->
                    <div class="poster-container">
                        <img src="{{ movie['poster_url'] }}" class="poster-img" alt="{{ movie['title'] }} Poster">
                    </div>

                    <!-- Movie Details -->
                    <div class="card-body">
                        <h5 class="card-title">{{ movie['title'] }}</h5>
                        <p class="card-text"><strong>Genres:</strong> {{ movie['genres_string'] }}</p>
                        <p class="card-text">
                            <strong>Rating:</strong>
                            <i class="fa-solid fa-star" style="color: #ffdd57;"></i>
                            {{ "%.1f"|format(movie['user_rating'] * 10)|replace('.', ',') }}
                        </p>
                        <a href="{{ movie['trailer_url'] }}" target="_blank" class="btn btn-primary btn-sm">
                            <i class="fa-solid fa-play"></i> Watch trailer
                        </a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>

        <!-- Back Button -->
        <a href="/" class="btn btn-secondary btn-block mt-4">
            <i class="fa-solid fa-arrow-left"></i> Back
        </a>


    </div>
</body>
</html>
