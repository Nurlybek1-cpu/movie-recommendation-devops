
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search and Filter</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* General Body Styling */
        body {
            background: linear-gradient(135deg, #2b2b2b, #1f1f1f);
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        /* Filter Container */
        .filter-container {
            background-color: rgba(50, 50, 50, 0.9);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            margin-top: 50px;
            transition: transform 0.3s ease;
        }

        .filter-container:hover {
            transform: translateY(-5px);
        }

        h4 {
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
            font-weight: bold;
            color: #ff6b6b;
        }

        /* Input Fields */
        .form-control, .custom-select {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            transition: border 0.3s;
        }

        .form-control:focus {
            border: 1px solid #ff6b6b;
            box-shadow: 0 0 5px #ff6b6b;
        }

        /* Custom Checkbox Styling */
        .form-check-input {
            background-color: #555;
            border-color: #888;
        }

        .form-check-input:checked {
            background-color: #ff6b6b;
            border-color: #ff6b6b;
        }

        .form-check-label {
            color: #ddd;
        }

        /* Submit Button */
        .btn-custom {
            background-color: #ff6b6b;
            color: white;
            font-weight: bold;
            transition: background 0.3s, transform 0.2s;
        }

        .btn-custom:hover {
            background-color: #fa5252;
            transform: scale(1.05);
            box-shadow: 0 4px 10px rgba(255, 107, 107, 0.5);
        }

        /* Icons */
        .filter-label i {
            color: #ff6b6b;
            margin-right: 10px;
        }

        /* Responsive Checkboxes */
        .form-check {
            margin-bottom: 8px;
        }

        /* Backdrop for better visuals */
        .container {
            max-width: 800px;
            background: rgba(30, 30, 30, 0.95);
            padding: 20px;
            border-radius: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="filter-container">
            <h4 class="text-center mb-4">
                <i class="fa-solid fa-film"></i> Select genres and films
            </h4>

            <!-- Search Bar -->
            <form action="/filter" method="POST">
                <div class="form-group">
                    <label for="search-title" class="filter-label">
                        <i class="fa-solid fa-search"></i> Search by film title:
                    </label>
                    <input type="text" id="search-title" name="search_title" class="form-control" placeholder="Введите название фильма...">
                </div>

                <!-- Genre Selection with Checkboxes -->
                <div class="form-group">
                    <label class="filter-label">
                        <i class="fa-solid fa-list"></i> Select genres:
                    </label>
                    <div class="row">
                        {% for genre in genres_list %}
                        <div class="col-md-4">
                            <div class="form-check">
                                <input type="checkbox" id="genre-{{ genre }}" name="selected_genres" value="{{ genre }}" class="form-check-input">
                                <label for="genre-{{ genre }}" class="form-check-label">{{ genre }}</label>
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                </div>

                <!-- Additional Filters -->
                <div class="form-check mt-3">
                    <input type="checkbox" id="all-genres" name="all_genres" class="form-check-input">
                    <label for="all-genres" class="form-check-label">
                        <i class="fa-solid fa-check-double"></i> All selected genres must be present
                    </label>
                </div>

                <div class="form-check mt-2">
                    <input type="checkbox" id="sort-rating" name="sort_rating" class="form-check-input">
                    <label for="sort-rating" class="form-check-label">
                        <i class="fa-solid fa-sort"></i> Sort by rating
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-custom btn-block mt-4">
                    <i class="fa-solid fa-arrow-right"></i> Recommend!
                </button>
            </form>
        </div>
    </div>
</body>
</html>
