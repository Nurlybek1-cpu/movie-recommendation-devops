version: '3.8' 
services:
  app:
    container_name: movie_recommender_app 
    build:
      context: . 
      dockerfile: Dockerfile 
    restart: unless-stopped 
    networks:
      - app-network 
  nginx:
    container_name: movie_recommender_nginx 
    image: nginx:stable-alpine 
    restart: unless-stopped 
    ports:
      - "5000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network 
    depends_on:
      - app 
networks:
  app-network:
    driver: bridge 

